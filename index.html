<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>MIDI to Riffle Flow Converter</title>
<style>
  :root {
    --bg: #0e1317;
    --surface: #182026;
    --surface-elevated: #222c35;
    --border: #2d3b47;
    --border-active: #486581;
    --text: #f0f4f8;
    --text-dim: #829ab1;
    --accent: #2e7d32;
    --accent-hover: #388e3c;
    --accent-active: #1b5e20;
    --cyan: #38bdf8;
    --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  body {
    margin: 0;
    padding: env(safe-area-inset-top, 16px) env(safe-area-inset-right, 16px) env(safe-area-inset-bottom, 16px) env(safe-area-inset-left, 16px);
    background-color: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  header {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  h1 {
    font-size: 1.15rem;
    font-weight: 700;
    margin: 0;
    letter-spacing: -0.01em;
  }

  .badge {
    font-size: 0.75rem;
    font-family: var(--mono);
    background: var(--surface-elevated);
    color: var(--cyan);
    padding: 4px 8px;
    border-radius: 6px;
    border: 1px solid var(--border);
  }

  .panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .grid-2col {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }

  @media (max-width: 700px) {
    .grid-2col {
      grid-template-columns: 1fr;
    }
  }

  .control-group {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  label {
    font-size: 0.75rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--text-dim);
  }

  .hint {
    font-size: 0.8rem;
    color: var(--text-dim);
    line-height: 1.35;
  }

  button, select, input[type="file"] {
    min-height: 44px;
    height: 44px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--surface-elevated);
    color: var(--text);
    font-size: 0.95rem;
    font-weight: 600;
    padding: 0 14px;
    touch-action: manipulation;
    cursor: pointer;
  }

  button.primary {
    background: var(--accent);
    border-color: #388e3c;
    color: #ffffff;
  }

  button.secondary {
    background: var(--surface-elevated);
    border-color: var(--border);
  }

  button:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }

  select {
    width: 100%;
    appearance: none;
    -webkit-appearance: none;
    padding-right: 36px;
    background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="%23829ab1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>');
    background-repeat: no-repeat;
    background-position: right 12px center;
  }

  .file-box {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .file-box input[type="file"] {
    padding: 8px 12px;
    background: var(--surface-elevated);
    font-family: var(--sans);
    font-size: 0.85rem;
  }

  .voice-picker-box {
    background: var(--surface-elevated);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px;
    max-height: 140px;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .voice-item {
    display: flex;
    align-items: center;
    gap: 10px;
    min-height: 44px;
    font-size: 0.85rem;
    touch-action: manipulation;
  }

  .voice-item input[type="checkbox"] {
    width: 22px;
    height: 22px;
    margin: 0;
    cursor: pointer;
  }

  .scroll-container {
    width: 100%;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    background: #090c0f;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px;
  }

  canvas {
    display: block;
    touch-action: manipulation;
  }

  .status-box {
    background: #090c0f;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px;
    font-family: var(--mono);
    font-size: 0.8rem;
    line-height: 1.4;
    color: var(--text-dim);
    max-height: 140px;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    white-space: pre-wrap;
  }

  .status-box span.ok { color: #4ade80; font-weight: 700; }
  .status-box span.warn { color: #facc15; }
  .status-box span.err { color: #f87171; font-weight: 700; }
</style>
</head>
<body>

  <header>
    <h1>MIDI to .riffle Converter</h1>
    <span class="badge">iPad Pro 11" Optimized</span>
  </header>

  <div class="panel">
    <div class="grid-2col">
      <div class="control-group file-box">
        <label for="templateInput">1) Structural Template .riffle (Optional)</label>
        <input type="file" id="templateInput" accept=".riffle,text/plain" />
        <span class="hint">Upload a native .riffle preset to inherit specific scale, key, and chord progressions.</span>
      </div>

      <div class="control-group file-box">
        <label for="midiInput">2) Source MIDI File</label>
        <input type="file" id="midiInput" accept=".mid,.midi,audio/midi,audio/x-midi" />
        <span class="hint">Compatible with Type 0 and Type 1 Standard MIDI Files.</span>
      </div>
    </div>

    <div id="voicePickerContainer" style="display:none;" class="control-group">
      <label>Select Tracks / Channels to Include</label>
      <div class="voice-picker-box" id="voiceList"></div>
    </div>
  </div>

  <div class="panel">
    <div class="grid-2col">
      <div class="control-group">
        <label for="pitchOffsetSelect">Pitch Transposition</label>
        <select id="pitchOffsetSelect">
          <option value="-12" selected>MIDI Note - 12 (Standard Riffler Offset)</option>
          <option value="0">MIDI Note Unchanged (0 semitones)</option>
          <option value="12">MIDI Note + 12</option>
          <option value="-24">MIDI Note - 24</option>
        </select>
      </div>

      <div class="control-group">
        <label for="quantizeSelect">Grid Quantization</label>
        <select id="quantizeSelect">
          <option value="16" selected>1/16 Note Grid (250 ticks)</option>
          <option value="8">1/8 Note Grid (500 ticks)</option>
          <option value="12">1/8 Triplet Grid (333 ticks)</option>
        </select>
      </div>
    </div>

    <div class="grid-2col">
      <div class="control-group">
        <label for="maxSlotsSelect">Pattern Length / Step Capacity</label>
        <select id="maxSlotsSelect">
          <option value="64">4 Bars (64 Steps)</option>
          <option value="128" selected>8 Bars (128 Steps)</option>
          <option value="256">16 Bars (256 Steps)</option>
        </select>
      </div>

      <div class="control-group">
        <label for="chordModeSelect">Polyphony / Chord Extraction</label>
        <select id="chordModeSelect">
          <option value="top" selected>Melody (Top Note Only)</option>
          <option value="bottom">Bass Line (Lowest Note Only)</option>
          <option value="all">Linear Arpeggio (All Notes)</option>
        </select>
      </div>
    </div>
  </div>

  <div class="panel">
    <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px;">
      <label>Tablature / Lane Preview</label>
      <div style="display:flex; gap:8px;">
        <button type="button" class="secondary" id="previewAudioBtn" disabled>Play Audio</button>
        <button type="button" class="primary" id="downloadRiffleBtn" disabled>Save .riffle</button>
      </div>
    </div>

    <div class="scroll-container" id="tabScrollContainer">
      <canvas id="tabCanvas" height="150"></canvas>
    </div>
  </div>

  <div class="panel">
    <label>Diagnostic Console</label>
    <div class="status-box" id="statusLog">Ready. Select a MIDI file to extract notes and compile .riffle buffers.</div>
  </div>

  <script>
    const RIFFLE_ARRAY_LEN = 2944;
    const CHORD_START = 50;
    const PITCH_START = 1024;
    const DUR_START   = 1536;
    const GATE_START  = 2048;
    const STR_START   = 2560;
    const FRET_START  = 2816;

    const OPEN_STRINGS = [
      { strIndex: 1, openMidi: 64, laneId: 71 }, // High E
      { strIndex: 2, openMidi: 59, laneId: 70 }, // B
      { strIndex: 3, openMidi: 55, laneId: 69 }, // G
      { strIndex: 4, openMidi: 50, laneId: 68 }, // D
      { strIndex: 5, openMidi: 45, laneId: 67 }, // A
      { strIndex: 6, openMidi: 40, laneId: 65 }  // Low E
    ];

    let currentMidi = null;
    let processedSteps = [];
    let customTemplateArray = null;
    let audioContext = null;
    let isPlayingAudio = false;

    const templateInput = document.getElementById('templateInput');
    const midiInput = document.getElementById('midiInput');
    const voicePickerContainer = document.getElementById('voicePickerContainer');
    const voiceList = document.getElementById('voiceList');
    const pitchOffsetSelect = document.getElementById('pitchOffsetSelect');
    const quantizeSelect = document.getElementById('quantizeSelect');
    const maxSlotsSelect = document.getElementById('maxSlotsSelect');
    const chordModeSelect = document.getElementById('chordModeSelect');
    const previewAudioBtn = document.getElementById('previewAudioBtn');
    const downloadRiffleBtn = document.getElementById('downloadRiffleBtn');
    const statusLog = document.getElementById('statusLog');
    const tabCanvas = document.getElementById('tabCanvas');
    const tabScrollContainer = document.getElementById('tabScrollContainer');
    const canvasCtx = tabCanvas.getContext('2d');

    function log(msg, level = 'info') {
      const el = document.createElement('div');
      const time = new Date().toLocaleTimeString();
      if (level === 'ok') el.innerHTML = `[${time}] <span class="ok">${msg}</span>`;
      else if (level === 'warn') el.innerHTML = `[${time}] <span class="warn">${msg}</span>`;
      else if (level === 'err') el.innerHTML = `[${time}] <span class="err">${msg}</span>`;
      else el.textContent = `[${time}] ${msg}`;
      statusLog.appendChild(el);
      statusLog.scrollTop = statusLog.scrollHeight;
    }

    function generateVerifiedTemplate() {
      const arr = new Array(RIFFLE_ARRAY_LEN).fill(0);
      arr[0] = 200;
      arr[1] = 12000;
      arr[2] = 8;
      arr[3] = 0;
      arr[4] = 69;
      arr[7] = 1;
      arr[11] = 3; arr[13] = 1; arr[16] = 2; arr[18] = 10; arr[19] = 9;
      arr[29] = 1;
      for (let b = 31; b <= 38; b++) arr[b] = 4000;
      arr[42] = 97; arr[43] = 100; arr[44] = 12; arr[45] = 65; arr[46] = 5; arr[47] = 8;

      const chordMarkers = [57, 60, 62, 65, 57, 60, 62, 65];
      for (let i = 0; i < 64; i++) {
        arr[CHORD_START + i] = chordMarkers[i % chordMarkers.length];
      }

      for (let i = 0; i < 128; i++) {
        arr[STR_START + i] = 69;
        arr[FRET_START + i] = 33;
      }
      arr[STR_START + 63] = 88;
      return arr;
    }

    function mapPitchToFretboard(rifflePitch) {
      if (rifflePitch <= 0) return { laneId: 65, fret: 0 };
      for (let s = 0; s < OPEN_STRINGS.length; s++) {
        const str = OPEN_STRINGS[s];
        if (rifflePitch >= str.openMidi) {
          const fret = rifflePitch - str.openMidi;
          if (fret <= 22) {
            return { laneId: str.laneId, fret: fret };
          }
        }
      }
      return { laneId: 65, fret: Math.max(0, rifflePitch - 40) };
    }

    function parseMidiBinary(arrayBuffer) {
      const dv = new DataView(arrayBuffer);
      let offset = 0;

      function readStr(len) {
        let out = '';
        for (let i = 0; i < len; i++) out += String.fromCharCode(dv.getUint8(offset++));
        return out;
      }

      if (readStr(4) !== 'MThd') throw new Error('Invalid MIDI header chunk');
      const headerLen = dv.getUint32(offset); offset += 4;
      const format = dv.getUint16(offset); offset += 2;
      const trackCount = dv.getUint16(offset); offset += 2;
      const timeDivision = dv.getUint16(offset); offset += 2;
      offset += (headerLen - 6);

      const ppqn = (timeDivision & 0x8000) === 0 ? timeDivision : 480;
      let detectedBpm = 120;
      const rawEvents = [];

      for (let t = 0; t < trackCount; t++) {
        if (offset >= dv.byteLength) break;
        const chunkTag = readStr(4);
        const chunkLen = dv.getUint32(offset); offset += 4;
        if (chunkTag !== 'MTrk') {
          offset += chunkLen;
          continue;
        }

        const trackEnd = offset + chunkLen;
        let currentTicks = 0;
        let runningStatus = 0;

        while (offset < trackEnd && offset < dv.byteLength) {
          let delta = 0, byte = 0;
          do {
            byte = dv.getUint8(offset++);
            delta = (delta << 7) | (byte & 0x7F);
          } while (byte & 0x80);

          currentTicks += delta;
          let status = dv.getUint8(offset);

          if (status < 0x80) {
            status = runningStatus;
          } else {
            offset++;
            runningStatus = status;
          }

          const msgType = status >> 4;
          const channel = status & 0x0F;

          if (status === 0xFF) {
            const metaType = dv.getUint8(offset++);
            let metaLen = 0;
            do {
              byte = dv.getUint8(offset++);
              metaLen = (metaLen << 7) | (byte & 0x7F);
            } while (byte & 0x80);

            if (metaType === 0x51 && metaLen === 3) {
              const mpqn = (dv.getUint8(offset) << 16) | (dv.getUint8(offset + 1) << 8) | dv.getUint8(offset + 2);
              detectedBpm = Math.round(60000000 / mpqn);
            }
            offset += metaLen;
          } else if (status === 0xF0 || status === 0xF7) {
            let sysexLen = 0;
            do {
              byte = dv.getUint8(offset++);
              sysexLen = (sysexLen << 7) | (byte & 0x7F);
            } while (byte & 0x80);
            offset += sysexLen;
          } else if (msgType === 0x9 || msgType === 0x8) {
            const note = dv.getUint8(offset++);
            const vel = dv.getUint8(offset++);
            if (note > 12) {
              rawEvents.push({
                ticks: currentTicks,
                isNoteOn: (msgType === 0x9 && vel > 0),
                pitch: note,
                vel: vel,
                track: t,
                channel: channel
              });
            }
          } else if (msgType === 0xC || msgType === 0xD) {
            offset += 1;
          } else {
            offset += 2;
          }
        }
      }

      rawEvents.sort((a, b) => a.ticks - b.ticks);

      const activeMap = new Map();
      const extractedNotes = [];
      for (const ev of rawEvents) {
        const key = `${ev.track}:${ev.channel}:${ev.pitch}`;
        if (ev.isNoteOn) {
          activeMap.set(key, ev);
        } else if (activeMap.has(key)) {
          const onEv = activeMap.get(key);
          extractedNotes.push({
            startTick: onEv.ticks,
            endTick: ev.ticks,
            durationTicks: Math.max(1, ev.ticks - onEv.ticks),
            pitch: onEv.pitch,
            vel: onEv.vel,
            track: onEv.track,
            channel: onEv.channel
          });
          activeMap.delete(key);
        }
      }

      return { bpm: detectedBpm, ppqn, notes: extractedNotes };
    }

    function processMidiSequence() {
      if (!currentMidi || currentMidi.notes.length === 0) return;

      const offset = parseInt(pitchOffsetSelect.value, 10);
      const quantizeDiv = parseInt(quantizeSelect.value, 10);
      const maxSlots = parseInt(maxSlotsSelect.value, 10);
      const chordMode = chordModeSelect.value;

      const checkedBoxes = document.querySelectorAll('.voice-chk:checked');
      const allowedVoices = new Set(Array.from(checkedBoxes).map(cb => cb.value));

      const ticksPerStep = (currentMidi.ppqn * 4) / quantizeDiv;
      const stepUnitDuration = Math.round(1000 / (quantizeDiv / 4));

      const bucketMap = new Map();
      for (const n of currentMidi.notes) {
        if (n.channel === 9) continue;
        const vKey = `${n.track}:${n.channel}`;
        if (allowedVoices.size > 0 && !allowedVoices.has(vKey)) continue;

        const stepIdx = Math.round(n.startTick / ticksPerStep);
        if (stepIdx < maxSlots) {
          if (!bucketMap.has(stepIdx)) bucketMap.set(stepIdx, []);
          bucketMap.get(stepIdx).push(n);
        }
      }

      processedSteps = new Array(maxSlots).fill(null).map(() => ({
        pitch: 0,
        durUnits: 0,
        gate: 0,
        laneId: 65,
        fret: 0
      }));

      for (let s = 0; s < maxSlots; s++) {
        if (!bucketMap.has(s)) continue;
        let notesInStep = bucketMap.get(s);
        notesInStep.sort((a, b) => a.pitch - b.pitch);

        let chosenNote = null;
        if (chordMode === 'top') chosenNote = notesInStep[notesInStep.length - 1];
        else if (chordMode === 'bottom') chosenNote = notesInStep[0];
        else chosenNote = notesInStep[0];

        if (chosenNote) {
          let rPitch = chosenNote.pitch + offset;
          while (rPitch > 64) rPitch -= 12;
          while (rPitch < 28) rPitch += 12;

          const fretMap = mapPitchToFretboard(rPitch);
          processedSteps[s] = {
            pitch: rPitch,
            durUnits: stepUnitDuration,
            gate: Math.max(80, Math.min(127, chosenNote.vel)),
            laneId: fretMap.laneId,
            fret: fretMap.fret
          };
        }
      }

      renderCanvasTab();
      previewAudioBtn.disabled = false;
      downloadRiffleBtn.disabled = false;
    }

    function renderCanvasTab() {
      const stepWidth = 28;
      const totalSteps = processedSteps.length;
      const cssWidth = Math.max(tabScrollContainer.clientWidth - 16, totalSteps * stepWidth + 40);
      const cssHeight = 150;
      const dpr = window.devicePixelRatio || 1;

      tabCanvas.width = cssWidth * dpr;
      tabCanvas.height = cssHeight * dpr;
      tabCanvas.style.width = cssWidth + 'px';
      tabCanvas.style.height = cssHeight + 'px';

      canvasCtx.save();
      canvasCtx.scale(dpr, dpr);

      canvasCtx.fillStyle = '#090c0f';
      canvasCtx.fillRect(0, 0, cssWidth, cssHeight);

      const quantizeDiv = parseInt(quantizeSelect.value, 10);

      for (let i = 0; i <= totalSteps; i++) {
        const x = 32 + i * stepWidth;
        canvasCtx.strokeStyle = (i % quantizeDiv === 0) ? '#486581' : '#182026';
        canvasCtx.lineWidth = (i % quantizeDiv === 0) ? 1.5 : 1;
        canvasCtx.beginPath();
        canvasCtx.moveTo(x, 15);
        canvasCtx.lineTo(x, 135);
        canvasCtx.stroke();
      }

      const laneSpacing = 18;
      const startY = 28;
      const stringLabels = ['e', 'B', 'G', 'D', 'A', 'E'];
      canvasCtx.fillStyle = '#829ab1';
      canvasCtx.font = '11px monospace';

      for (let s = 0; s < 6; s++) {
        const y = startY + s * laneSpacing;
        canvasCtx.fillText(stringLabels[s], 12, y + 4);
        canvasCtx.strokeStyle = '#222c35';
        canvasCtx.lineWidth = 1;
        canvasCtx.beginPath();
        canvasCtx.moveTo(30, y);
        canvasCtx.lineTo(cssWidth - 10, y);
        canvasCtx.stroke();
      }

      for (let i = 0; i < totalSteps; i++) {
        const st = processedSteps[i];
        if (st.pitch > 0) {
          const x = 32 + i * stepWidth + stepWidth / 2;
          const strIndex = OPEN_STRINGS.find(o => o.laneId === st.laneId)?.strIndex || 6;
          const y = startY + (strIndex - 1) * laneSpacing;

          canvasCtx.fillStyle = '#1e293b';
          canvasCtx.beginPath();
          canvasCtx.arc(x, y, 8, 0, Math.PI * 2);
          canvasCtx.fill();
          canvasCtx.strokeStyle = '#38bdf8';
          canvasCtx.lineWidth = 1.5;
          canvasCtx.stroke();

          canvasCtx.fillStyle = '#ffffff';
          canvasCtx.font = 'bold 9px sans-serif';
          canvasCtx.textAlign = 'center';
          canvasCtx.textBaseline = 'middle';
          canvasCtx.fillText(st.fret.toString(), x, y);
        }
      }
      canvasCtx.restore();
    }

    function compileRiffleArray() {
      const out = customTemplateArray ? customTemplateArray.slice() : generateVerifiedTemplate();

      out[0] = 200;
      out[1] = (currentMidi?.bpm || 120) * 100;
      out[2] = processedSteps.length >= 128 ? 8 : 4;
      out[4] = 69;

      const numBars = out[2];
      for (let b = 31; b < 31 + numBars; b++) {
        out[b] = 4000;
      }

      const chordNotes = processedSteps.filter(s => s.pitch > 0).map(s => s.pitch);
      if (chordNotes.length > 0) {
        for (let c = 0; c < 64; c++) {
          out[CHORD_START + c] = chordNotes[c % chordNotes.length];
        }
      }

      const activeLen = processedSteps.length;

      for (let i = 0; i < 512; i++) {
        out[PITCH_START + i] = 0;
        out[DUR_START + i]   = 0;
        out[GATE_START + i]  = 0;
      }

      for (let i = 0; i < activeLen; i++) {
        const st = processedSteps[i];
        out[PITCH_START + i] = st.pitch;
        out[DUR_START + i]   = st.durUnits;
        out[GATE_START + i]  = st.gate;

        if (STR_START + i < 2816) {
          out[STR_START + i] = st.laneId;
        }
        if (FRET_START + i < RIFFLE_ARRAY_LEN) {
          out[FRET_START + i] = st.fret;
        }
      }

      out[PITCH_START + activeLen] = -1;
      out[DUR_START + activeLen]   = -1;
      out[GATE_START + activeLen]  = -1;

      return out;
    }

    function buildRiffleBlob(integers) {
      const csvString = integers.join(',') + ',';
      const byteLen = 2 + csvString.length * 2;
      const buffer = new ArrayBuffer(byteLen);
      const dv = new DataView(buffer);

      dv.setUint8(0, 0xFF);
      dv.setUint8(1, 0xFE);

      for (let i = 0; i < csvString.length; i++) {
        dv.setUint16(2 + i * 2, csvString.charCodeAt(i), true);
      }

      return new Blob([buffer], { type: 'application/octet-stream' });
    }

    async function exportRiffle() {
      try {
        const integers = compileRiffleArray();
        const blob = buildRiffleBlob(integers);
        const fileName = `converted_${currentMidi?.bpm || 120}bpm.riffle`;
        const fileObj = new File([blob], fileName, { type: 'application/octet-stream' });

        if (navigator.canShare && navigator.canShare({ files: [fileObj] })) {
          await navigator.share({ files: [fileObj], title: fileName });
          log(`Exported ${fileName}. Tap "Save to Files" in the iOS Share Sheet.`, 'ok');
        } else {
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = fileName;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          URL.revokeObjectURL(url);
          log(`Exported ${fileName} directly. Check Downloads in the Files app.`, 'ok');
        }
      } catch (err) {
        log(`Export failed: ${err.message}`, 'err');
      }
    }

    function toggleAudioPlayback() {
      if (isPlayingAudio) {
        if (audioContext) audioContext.close();
        isPlayingAudio = false;
        previewAudioBtn.textContent = 'Play Audio';
        return;
      }

      const AudioCtxClass = window.AudioContext || window.webkitAudioContext;
      audioContext = new AudioCtxClass();
      if (audioContext.state === 'suspended') audioContext.resume();

      isPlayingAudio = true;
      previewAudioBtn.textContent = 'Stop Audio';

      const bpm = currentMidi?.bpm || 120;
      const quantizeDiv = parseInt(quantizeSelect.value, 10);
      const stepDurationSec = (60 / bpm) / (quantizeDiv / 4);
      let scheduleTime = audioContext.currentTime + 0.05;

      processedSteps.forEach((st, idx) => {
        if (st.pitch > 0) {
          const osc = audioContext.createOscillator();
          const gain = audioContext.createGain();

          const midiPitch = st.pitch + 12;
          const freq = 440 * Math.pow(2, (midiPitch - 69) / 12);

          osc.type = 'triangle';
          osc.frequency.setValueAtTime(freq, scheduleTime + idx * stepDurationSec);

          const peakGain = (st.gate / 127) * 0.3;
          gain.gain.setValueAtTime(peakGain, scheduleTime + idx * stepDurationSec);
          gain.gain.exponentialRampToValueAtTime(0.001, scheduleTime + (idx + 0.85) * stepDurationSec);

          osc.connect(gain);
          gain.connect(audioContext.destination);

          osc.start(scheduleTime + idx * stepDurationSec);
          osc.stop(scheduleTime + (idx + 1) * stepDurationSec);
        }
      });

      const totalTime = processedSteps.length * stepDurationSec;
      setTimeout(() => {
        isPlayingAudio = false;
        previewAudioBtn.textContent = 'Play Audio';
      }, totalTime * 1000);
    }

    function populateVoicePicker(notes) {
      voiceList.innerHTML = '';
      const voiceMap = new Map();
      for (const n of notes) {
        if (n.channel === 9) continue;
        const key = `${n.track}:${n.channel}`;
        if (!voiceMap.has(key)) voiceMap.set(key, { count: 0, track: n.track, channel: n.channel });
        voiceMap.get(key).count++;
      }

      if (voiceMap.size > 1) {
        voicePickerContainer.style.display = 'flex';
        voiceMap.forEach((val, key) => {
          const row = document.createElement('label');
          row.className = 'voice-item';
          row.innerHTML = `<input type="checkbox" class="voice-chk" value="${key}" checked /> Track ${val.track}, Channel ${val.channel + 1} (${val.count} notes)`;
          row.querySelector('input').addEventListener('change', processMidiSequence);
          voiceList.appendChild(row);
        });
      } else {
        voicePickerContainer.style.display = 'none';
      }
    }

    templateInput.addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      try {
        const ab = await file.arrayBuffer();
        const bytes = new Uint8Array(ab);
        let text = '';
        if (bytes[0] === 0xFF && bytes[1] === 0xFE) {
          for (let i = 2; i + 1 < bytes.length; i += 2) text += String.fromCharCode(bytes[i] | (bytes[i + 1] << 8));
        } else {
          text = new TextDecoder('utf-8').decode(bytes);
        }
        const nums = text.split(',').map(x => x.trim()).filter(x => x.length).map(x => parseInt(x, 10));
        if (nums.length < 2560) throw new Error('Template file smaller than expected .riffle structure');
        customTemplateArray = nums;
        log(`Loaded custom template: ${file.name} (${nums.length} values)`, 'ok');
      } catch (err) {
        log(`Template error: ${err.message}`, 'err');
      }
    });

    midiInput.addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      try {
        const buffer = await file.arrayBuffer();
        currentMidi = parseMidiBinary(buffer);
        log(`Parsed MIDI: ${file.name} (${currentMidi.notes.length} notes, ${currentMidi.bpm} BPM)`, 'ok');
        populateVoicePicker(currentMidi.notes);
        processMidiSequence();
      } catch (err) {
        log(`MIDI Error: ${err.message}`, 'err');
      }
    });

    pitchOffsetSelect.addEventListener('change', processMidiSequence);
    quantizeSelect.addEventListener('change', processMidiSequence);
    maxSlotsSelect.addEventListener('change', processMidiSequence);
    chordModeSelect.addEventListener('change', processMidiSequence);
    previewAudioBtn.addEventListener('click', toggleAudioPlayback);
    downloadRiffleBtn.addEventListener('click', exportRiffle);
    window.addEventListener('resize', renderCanvasTab);

    renderCanvasTab();
  </script>
</body>
</html>
