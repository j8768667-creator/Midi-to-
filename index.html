<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>MIDI to .riffle Converter</title>
  <style>
    :root {
      --bg: #0d1117;
      --card-bg: #161b22;
      --border: #30363d;
      --accent: #238636;
      --accent-hover: #2ea043;
      --text: #c9d1d9;
      --text-bold: #f0f6fc;
      --cyan: #38bdf8;
      --warn: #eab308;
    }
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    body {
      margin: 0;
      padding: env(safe-area-inset-top, 16px) env(safe-area-inset-right, 16px) env(safe-area-inset-bottom, 16px) env(safe-area-inset-left, 16px);
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      touch-action: manipulation;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 14px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
    }
    h1 {
      font-size: 1.1rem;
      margin: 0;
      color: var(--text-bold);
    }
    .badge {
      font-size: 0.75rem;
      background: #21262d;
      color: var(--cyan);
      padding: 4px 8px;
      border-radius: 4px;
      border: 1px solid var(--border);
      font-weight: 600;
    }
    .panel {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .controls-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 12px;
    }
    .control-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    label {
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--text-bold);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    button, select, .file-btn {
      min-height: 44px;
      height: 44px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: #21262d;
      color: var(--text-bold);
      font-size: 0.9rem;
      padding: 0 14px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      touch-action: manipulation;
      cursor: pointer;
    }
    select {
      appearance: none;
      -webkit-appearance: none;
      padding-right: 32px;
      background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="%23c9d1d9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>');
      background-repeat: no-repeat;
      background-position: right 10px center;
    }
    button.primary {
      background: var(--accent);
      border-color: var(--accent-hover);
      font-weight: 600;
    }
    button:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }
    .file-input-wrapper {
      position: relative;
      width: 100%;
    }
    .file-input-wrapper input[type="file"] {
      position: absolute;
      left: 0;
      top: 0;
      opacity: 0;
      width: 100%;
      height: 100%;
      cursor: pointer;
    }
    .file-btn {
      width: 100%;
      background: var(--accent);
      border-color: var(--accent-hover);
      font-weight: 600;
    }
    .tab-container {
      width: 100%;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      background: #090d13;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 8px;
    }
    canvas {
      display: block;
      touch-action: manipulation;
    }
    .status-log {
      font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
      font-size: 0.8rem;
      line-height: 1.4;
      color: #8b949e;
      background: #090d13;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid var(--border);
      max-height: 120px;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }
    .status-log span.ok { color: #3fb950; font-weight: bold; }
    .status-log span.warn { color: var(--warn); }
    .status-log span.err { color: #f85149; }
  </style>
</head>
<body>

  <header>
    <h1>MIDI to .riffle Exporter</h1>
    <span class="badge">UTF-16LE &bull; 2944 Ints</span>
  </header>

  <div class="panel">
    <div class="controls-grid">
      <div class="control-group">
        <label>Input MIDI (.mid, .midi)</label>
        <div class="file-input-wrapper">
          <button type="button" class="file-btn" id="fileBtnText">Select MIDI File</button>
          <input type="file" id="midiInput" accept=".mid,.midi,audio/midi,audio/x-midi" />
        </div>
      </div>
      <div class="control-group">
        <label>Step Resolution</label>
        <select id="quantizeSelect">
          <option value="16" selected>1/16 Note Grid (250 ticks)</option>
          <option value="8">1/8 Note Grid (500 ticks)</option>
        </select>
      </div>
      <div class="control-group">
        <label>Bar Count</label>
        <select id="barsSelect">
          <option value="4" selected>4 Bars (Field[2] = 4)</option>
          <option value="8">8 Bars (Field[2] = 8)</option>
        </select>
      </div>
    </div>
  </div>

  <div class="panel">
    <div style="display:flex; justify-content:space-between; align-items:center;">
      <label>Sequence Preview</label>
      <div style="display:flex; gap:8px;">
        <button type="button" id="previewBtn" disabled>Play</button>
        <button type="button" class="primary" id="exportBtn" disabled>Export .riffle</button>
      </div>
    </div>
    <div class="tab-container" id="tabScrollContainer">
      <canvas id="tabCanvas" height="150"></canvas>
    </div>
  </div>

  <div class="panel">
    <label>Console &amp; Field Verification</label>
    <div class="status-log" id="statusLog">Ready. Select a MIDI file to convert.</div>
  </div>

  <script>
    const ARRAY_SIZE = 2944; // Fixed field count confirmed in ChatGPT review
    const PITCH_OFFSET = 1024;
    const DUR_OFFSET = 1536;
    const VEL_OFFSET = 2048;

    let parsedEvents = [];
    let detectedBpm = 62;
    let sequenceData = [];
    let isPlaying = false;
    let audioCtx = null;

    const midiInput = document.getElementById('midiInput');
    const fileBtnText = document.getElementById('fileBtnText');
    const quantizeSelect = document.getElementById('quantizeSelect');
    const barsSelect = document.getElementById('barsSelect');
    const previewBtn = document.getElementById('previewBtn');
    const exportBtn = document.getElementById('exportBtn');
    const statusLog = document.getElementById('statusLog');
    const tabCanvas = document.getElementById('tabCanvas');
    const tabScrollContainer = document.getElementById('tabScrollContainer');
    const ctx = tabCanvas.getContext('2d');

    function log(msg, type = 'info') {
      const span = document.createElement('span');
      if (type === 'ok') span.className = 'ok';
      if (type === 'warn') span.className = 'warn';
      if (type === 'err') span.className = 'err';
      span.innerHTML = `[${new Date().toLocaleTimeString()}] ${msg}<br>`;
      statusLog.appendChild(span);
      statusLog.scrollTop = statusLog.scrollHeight;
    }

    // Binary Standard MIDI File Parser
    function parseMidiBuffer(buffer) {
      const dv = new DataView(buffer);
      let offset = 0;

      function readStr(len) {
        let s = '';
        for (let i = 0; i < len; i++) s += String.fromCharCode(dv.getUint8(offset++));
        return s;
      }

      if (readStr(4) !== 'MThd') throw new Error('Not a valid MIDI header');
      const headerLen = dv.getUint32(offset); offset += 4;
      const format = dv.getUint16(offset); offset += 2;
      const trackCount = dv.getUint16(offset); offset += 2;
      const timeDiv = dv.getUint16(offset); offset += 2;
      offset += (headerLen - 6);

      const ppqn = (timeDiv & 0x8000) === 0 ? timeDiv : 480;
      let bpm = 120;
      const events = [];

      for (let t = 0; t < trackCount; t++) {
        if (offset >= dv.byteLength) break;
        if (readStr(4) !== 'MTrk') break;
        const trackLen = dv.getUint32(offset); offset += 4;
        const trackEnd = offset + trackLen;
        let runningStatus = 0;
        let currentTicks = 0;

        while (offset < trackEnd && offset < dv.byteLength) {
          let delta = 0, byte = 0;
          do {
            byte = dv.getUint8(offset++);
            delta = (delta << 7) | (byte & 0x7F);
          } while (byte & 0x80);

          currentTicks += delta;
          let status = dv.getUint8(offset);

          if (status < 0x80) {
            status = runningStatus;
          } else {
            offset++;
            runningStatus = status;
          }

          const type = status >> 4;
          if (status === 0xFF) {
            const meta = dv.getUint8(offset++);
            let len = 0;
            do {
              byte = dv.getUint8(offset++);
              len = (len << 7) | (byte & 0x7F);
            } while (byte & 0x80);

            if (meta === 0x51 && len === 3) {
              const mpqn = (dv.getUint8(offset) << 16) | (dv.getUint8(offset + 1) << 8) | dv.getUint8(offset + 2);
              bpm = Math.round(60000000 / mpqn);
            }
            offset += len;
          } else if (status === 0xF0 || status === 0xF7) {
            let len = 0;
            do {
              byte = dv.getUint8(offset++);
              len = (len << 7) | (byte & 0x7F);
            } while (byte & 0x80);
            offset += len;
          } else if (type === 0x9 || type === 0x8) {
            const note = dv.getUint8(offset++);
            const vel = dv.getUint8(offset++);
            // Ignore note 12 with vel 0 boundary artifact
            if (note !== 12 || vel > 0) {
              events.push({
                ticks: currentTicks,
                isNoteOn: (type === 0x9 && vel > 0),
                pitch: note,
                vel: vel
              });
            }
          } else if (type === 0xC || type === 0xD) {
            offset += 1;
          } else {
            offset += 2;
          }
        }
      }

      events.sort((a, b) => a.ticks - b.ticks);

      // Pair Note-on and Note-off
      const active = new Map();
      const notes = [];
      for (const ev of events) {
        if (ev.isNoteOn) {
          active.set(ev.pitch, ev);
        } else if (active.has(ev.pitch)) {
          const onEv = active.get(ev.pitch);
          notes.push({
            startTick: onEv.ticks,
            durationTicks: Math.max(1, ev.ticks - onEv.ticks),
            pitch: onEv.pitch,
            vel: onEv.vel
          });
          active.delete(ev.pitch);
        }
      }

      return { bpm, ppqn, notes };
    }

    // Process MIDI into the 1000-tick Riffler grid with -12 semitone shift
    function buildSequence(midiData, bars, stepsPerBar) {
      const totalSteps = bars * stepsPerBar;
      const ticksPerStep = (midiData.ppqn * 4) / stepsPerBar;
      const stepRiffleTicks = 1000 / (stepsPerBar / 4); // 250 for 16th, 500 for 8th

      const steps = [];
      for (let i = 0; i < totalSteps; i++) {
        steps.push({ pitch: 0, duration: 0, vel: 0 });
      }

      for (const n of midiData.notes) {
        const stepIdx = Math.round(n.startTick / ticksPerStep);
        if (stepIdx < totalSteps) {
          // Pitch Rule: riffle_pitch = midi_pitch - 12
          const rifflePitch = Math.max(0, n.pitch - 12);
          if (steps[stepIdx].pitch === 0 || n.vel > steps[stepIdx].vel) {
            steps[stepIdx] = {
              pitch: rifflePitch,
              duration: stepRiffleTicks,
              vel: n.vel
            };
          }
        }
      }
      return steps;
    }

    function renderDisplay() {
      const stepWidth = 28;
      const width = Math.max(tabScrollContainer.clientWidth - 16, sequenceData.length * stepWidth + 40);
      tabCanvas.width = width;
      tabCanvas.height = 150;

      ctx.fillStyle = '#090d13';
      ctx.fillRect(0, 0, width, 150);

      // Draw Grid Lines
      const stepsPerBar = parseInt(quantizeSelect.value, 10);
      for (let i = 0; i <= sequenceData.length; i++) {
        const x = 30 + i * stepWidth;
        ctx.strokeStyle = (i % stepsPerBar === 0) ? '#484f58' : '#21262d';
        ctx.lineWidth = (i % stepsPerBar === 0) ? 1.5 : 1;
        ctx.beginPath();
        ctx.moveTo(x, 20);
        ctx.lineTo(x, 130);
        ctx.stroke();
      }

      // Draw Note Bars
      for (let i = 0; i < sequenceData.length; i++) {
        const st = sequenceData[i];
        if (st.pitch > 0) {
          const x = 30 + i * stepWidth + 2;
          // Scale MIDI pitch (28 to 84) to canvas height
          const y = 120 - ((st.pitch - 28) / (84 - 28)) * 90;
          ctx.fillStyle = '#38bdf8';
          ctx.fillRect(x, Math.max(25, Math.min(115, y)), stepWidth - 4, 8);

          ctx.fillStyle = '#f0f6fc';
          ctx.font = '10px monospace';
          ctx.fillText(st.pitch.toString(), x, Math.max(20, y - 2));
        }
      }
    }

    // Generate .riffle array matching the confirmed 2944 integer specification
    function generateRiffleArray() {
      const arr = new Array(ARRAY_SIZE).fill(0);
      const bars = parseInt(barsSelect.value, 10);

      // Header Configuration
      arr[0] = 200;
      arr[1] = detectedBpm * 100; // field[1] = BPM * 100
      arr[2] = bars;              // field[2] = Bar count
      arr[3] = 1;
      arr[4] = 69;

      // field[2] correlation: whole-note slots (4000) at indices 31..34 or 31..38
      for (let i = 31; i < 31 + bars; i++) {
        arr[i] = 4000;
      }

      // Populate pitch, duration, and velocity buffers
      for (let i = 0; i < sequenceData.length; i++) {
        const st = sequenceData[i];
        arr[PITCH_OFFSET + i] = st.pitch;
        arr[DUR_OFFSET + i] = st.duration;
        arr[VEL_OFFSET + i] = st.vel;
      }

      // Buffer terminators
      arr[PITCH_OFFSET + sequenceData.length] = -1;
      arr[DUR_OFFSET + sequenceData.length] = -1;
      arr[VEL_OFFSET + sequenceData.length] = -1;

      return arr;
    }

    // UTF-16LE Writer with BOM (0xFF 0xFE)
    function exportUtf16LeRiffle() {
      const arr = generateRiffleArray();
      // Comma-separated with trailing comma
      const text = arr.join(',') + ',';

      // Allocate Uint8Array for UTF-16LE: 2 bytes for BOM + 2 bytes per char
      const buf = new ArrayBuffer(2 + text.length * 2);
      const view = new DataView(buf);

      // Write BOM
      view.setUint16(0, 0xFEFF, false); // Big-endian write of FE FF stores as 0xFF 0xFE in little-endian

      // Write code units little-endian
      for (let i = 0; i < text.length; i++) {
        view.setUint16(2 + i * 2, text.charCodeAt(i), true);
      }

      const blob = new Blob([buf], { type: 'application/octet-stream' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `exported_${detectedBpm}bpm.riffle`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      log(`Downloaded UTF-16LE .riffle (${buf.byteLength} bytes, 2944 fields)`, 'ok');
    }

    function playAudio() {
      if (isPlaying) {
        if (audioCtx) audioCtx.close();
        isPlaying = false;
        previewBtn.textContent = 'Play';
        return;
      }

      const AudioContextClass = window.AudioContext || window.webkitAudioContext;
      audioCtx = new AudioContextClass();
      isPlaying = true;
      previewBtn.textContent = 'Stop';

      const stepsPerBar = parseInt(quantizeSelect.value, 10);
      const stepDurSec = (60 / detectedBpm) / (stepsPerBar / 4);
      let t = audioCtx.currentTime + 0.05;

      sequenceData.forEach((st, idx) => {
        if (st.pitch > 0) {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          // st.pitch is Riffle pitch; convert back to MIDI pitch (+12) for audible output
          const midiPitch = st.pitch + 12;
          const freq = 440 * Math.pow(2, (midiPitch - 69) / 12);

          osc.type = 'triangle';
          osc.frequency.setValueAtTime(freq, t + idx * stepDurSec);

          gain.gain.setValueAtTime((st.vel / 127) * 0.35, t + idx * stepDurSec);
          gain.gain.exponentialRampToValueAtTime(0.001, t + (idx + 0.9) * stepDurSec);

          osc.connect(gain);
          gain.connect(audioCtx.destination);

          osc.start(t + idx * stepDurSec);
          osc.stop(t + (idx + 1) * stepDurSec);
        }
      });

      setTimeout(() => {
        isPlaying = false;
        previewBtn.textContent = 'Play';
      }, sequenceData.length * stepDurSec * 1000);
    }

    midiInput.addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;

      fileBtnText.textContent = file.name;
      try {
        const buffer = await file.arrayBuffer();
        const parsed = parseMidiBuffer(buffer);
        detectedBpm = parsed.bpm || 120;
        parsedEvents = parsed;

        log(`Parsed MIDI successfully. Detected Tempo: ${detectedBpm} BPM, Notes: ${parsed.notes.length}`, 'ok');

        const bars = parseInt(barsSelect.value, 10);
        const stepsPerBar = parseInt(quantizeSelect.value, 10);
        sequenceData = buildSequence(parsed, bars, stepsPerBar);

        renderDisplay();
        previewBtn.disabled = false;
        exportBtn.disabled = false;
      } catch (err) {
        log(`MIDI Error: ${err.message}`, 'err');
      }
    });

    quantizeSelect.addEventListener('change', () => {
      if (parsedEvents.notes) {
        sequenceData = buildSequence(parsedEvents, parseInt(barsSelect.value, 10), parseInt(quantizeSelect.value, 10));
        renderDisplay();
      }
    });

    barsSelect.addEventListener('change', () => {
      if (parsedEvents.notes) {
        sequenceData = buildSequence(parsedEvents, parseInt(barsSelect.value, 10), parseInt(quantizeSelect.value, 10));
        renderDisplay();
      }
    });

    previewBtn.addEventListener('click', playAudio);
    exportBtn.addEventListener('click', exportUtf16LeRiffle);
    window.addEventListener('resize', renderDisplay);
    renderDisplay();
  </script>
</body>
</html>
