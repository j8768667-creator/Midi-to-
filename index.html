<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>MIDI to .riffle Converter</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Note: @tonejs/midi is used to accurately parse the binary MIDI file -->
  <script src="https://unpkg.com/@tonejs/midi"></script>
  <style>
    /* Prevent double-tap zoom on iPadOS */
    body {
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }
    
    /* Ensure minimum 44x44px touch targets */
    .touch-target {
      min-height: 44px;
      min-width: 44px;
    }
    
    /* Custom styling for the file input wrapper */
    .file-input-wrapper input[type="file"] {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      cursor: pointer;
    }
  </style>
</head>
<body class="bg-gray-950 text-gray-100 font-sans h-screen flex flex-col items-center justify-center p-6 antialiased">

  <main class="w-full max-w-md bg-gray-900 border border-gray-800 rounded-xl shadow-2xl p-8 flex flex-col gap-6">
    <header class="text-center">
      <h1 class="text-2xl font-semibold tracking-tight text-white">MIDI to Riffle</h1>
      <p class="text-sm text-gray-400 mt-1">Select a standard .mid file to convert</p>
    </header>

    <!-- File Selection -->
    <div class="relative file-input-wrapper bg-gray-800 hover:bg-gray-700 border-2 border-dashed border-gray-600 rounded-lg flex items-center justify-center touch-target transition-colors">
      <input type="file" id="midiInput" accept=".mid,.midi,audio/midi,audio/x-midi" aria-label="Upload MIDI File">
      <span id="fileLabel" class="text-gray-300 font-medium pointer-events-none px-4 py-3">Tap to Select MIDI File</span>
    </div>

    <!-- Error/Status Output -->
    <div id="statusOutput" class="text-sm text-center font-mono h-6 text-emerald-400"></div>

    <!-- Action Button -->
    <button id="convertBtn" disabled class="touch-target w-full bg-emerald-600 hover:bg-emerald-500 disabled:bg-gray-700 disabled:text-gray-500 text-white font-semibold rounded-lg transition-colors flex items-center justify-center">
      Convert & Download
    </button>
  </main>

  <script>
    const midiInput = document.getElementById('midiInput');
    const fileLabel = document.getElementById('fileLabel');
    const convertBtn = document.getElementById('convertBtn');
    const statusOutput = document.getElementById('statusOutput');
    let loadedMidi = null;
    let fileName = 'sequence';

    // Handle File Selection
    midiInput.addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;

      fileLabel.textContent = file.name;
      fileName = file.name.replace(/\.[^/.]+$/, "");
      statusOutput.textContent = 'Parsing MIDI...';
      convertBtn.disabled = true;

      try {
        const arrayBuffer = await file.arrayBuffer();
        loadedMidi = new Midi(arrayBuffer);
        statusOutput.textContent = `Loaded: ${loadedMidi.tracks.length} tracks`;
        convertBtn.disabled = false;
      } catch (err) {
        statusOutput.textContent = 'Error parsing MIDI file.';
        statusOutput.classList.replace('text-emerald-400', 'text-red-400');
        console.error(err);
      }
    });

    // Handle Conversion
    convertBtn.addEventListener('click', () => {
      if (!loadedMidi) return;
      
      try {
        const riffleCsv = convertMidiToRiffle(loadedMidi);
        const blob = new Blob([riffleCsv], { type: 'text/csv' });
        const url = URL.createObjectURL(blob);
        
        const a = document.createElement('a');
        a.href = url;
        a.download = `${fileName}.riffle`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        
        URL.revokeObjectURL(url);
        statusOutput.textContent = 'Download complete.';
      } catch (err) {
        statusOutput.textContent = 'Conversion failed.';
        statusOutput.classList.replace('text-emerald-400', 'text-red-400');
        console.error(err);
      }
    });

    /**
     * Converts Tonejs/Midi structure to .riffle CSV format
     * Note: Header padding is scaffolded based on pattern analysis.
     */
    function convertMidiToRiffle(midi) {
      const riffle = [];
      const activeTracks = midi.tracks.filter(t => t.notes.length > 0);
      const trackCount = activeTracks.length || 1;

      // 1. Build Header
      riffle.push(200, 10000, trackCount, 0, 69, 0, 0, 1, 0, 0, 0, 3);
      
      // Pad intermediate header values
      for(let i = 0; i < 19; i++) riffle.push(0);
      
      // Inject track duration blocks
      for(let i = 0; i < trackCount; i++) riffle.push(4000);
      
      // Pad to note data start
      for(let i = 0; i < 20; i++) riffle.push(0);

      // 2. Build Track Sequences
      activeTracks.forEach(track => {
        // Standardize to 16 steps for baseline conversion
        const steps = 16;
        const pitches = new Array(steps).fill(0);
        const gates = new Array(steps).fill(-1);
        const durations = new Array(steps).fill(0);
        const velocities = new Array(steps).fill(0);

        track.notes.forEach(note => {
          // Map temporal position to grid step
          const stepIndex = Math.floor((note.time / midi.duration) * steps) % steps;
          
          pitches[stepIndex] = note.midi;
          gates[stepIndex] = 0; // 0 = active trigger
          durations[stepIndex] = Math.round(note.duration * 1000);
          velocities[stepIndex] = Math.round(note.velocity * 127);
        });

        // Append sequential lanes for this track
        riffle.push(...pitches, ...gates, ...durations, ...velocities);
      });

      return riffle.join(',');
    }
  </script>
</body>
</html>
