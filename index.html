<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>MIDI to .riffle Converter</title>
  <style>
    :root {
      --bg-canvas: #121316;
      --bg-card: #1c1e24;
      --bg-input: #262933;
      --border-subtle: #333846;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --accent: #2563eb;
      --accent-active: #1d4ed8;
      --accent-soft: rgba(37, 99, 235, 0.15);
      --success-bg: rgba(16, 185, 129, 0.15);
      --success-text: #6ee7b7;
      --error-bg: rgba(239, 68, 68, 0.15);
      --error-text: #fca5a5;
      --touch-min: 44px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-canvas);
      color: var(--text-main);
      touch-action: manipulation;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    }

    header {
      padding: 14px 20px;
      background: var(--bg-card);
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .app-title {
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: -0.01em;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .pill {
      font-size: 0.7rem;
      text-transform: uppercase;
      background: var(--accent-soft);
      color: #93c5fd;
      padding: 3px 8px;
      border-radius: 4px;
      font-weight: 600;
      letter-spacing: 0.05em;
    }

    main {
      flex: 1;
      max-width: 1080px;
      width: 100%;
      margin: 0 auto;
      padding: 20px;
      display: grid;
      grid-template-columns: 1fr;
      gap: 20px;
    }

    @media (min-width: 768px) {
      main {
        grid-template-columns: 1fr 1fr;
        padding: 24px;
      }
    }

    .card {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .card-title {
      font-size: 0.95rem;
      font-weight: 600;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .file-dropzone {
      position: relative;
      border: 2px dashed var(--border-subtle);
      border-radius: 8px;
      padding: 24px 16px;
      text-align: center;
      background: var(--bg-input);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      cursor: pointer;
      min-height: 140px;
    }

    .file-dropzone.active {
      border-color: var(--accent);
      background: var(--accent-soft);
    }

    /* Native touch file input */
    input[type="file"] {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      cursor: pointer;
      z-index: 10;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    label {
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    select, input[type="number"], input[type="text"] {
      min-height: var(--touch-min);
      padding: 0 12px;
      background: var(--bg-input);
      border: 1px solid var(--border-subtle);
      border-radius: 8px;
      color: var(--text-main);
      font-size: 0.95rem;
      font-family: inherit;
    }

    select:focus, input:focus {
      outline: none;
      border-color: var(--accent);
    }

    .stat-row {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    .stat-box {
      background: var(--bg-input);
      padding: 12px;
      border-radius: 8px;
      border: 1px solid var(--border-subtle);
    }

    .stat-label {
      font-size: 0.7rem;
      color: var(--text-muted);
      text-transform: uppercase;
      margin-bottom: 2px;
    }

    .stat-value {
      font-size: 1.15rem;
      font-weight: 700;
    }

    .btn {
      min-height: var(--touch-min);
      min-width: var(--touch-min);
      padding: 0 20px;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 600;
      border: none;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      touch-action: manipulation;
      transition: background 0.15s ease;
    }

    .btn-primary {
      background: var(--accent);
      color: #fff;
    }

    .btn-primary:active {
      background: var(--accent-active);
    }

    .btn-secondary {
      background: var(--bg-input);
      color: var(--text-main);
      border: 1px solid var(--border-subtle);
    }

    .btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .preview-box {
      display: flex;
      flex-direction: column;
      gap: 4px;
      max-height: 240px;
      overflow-y: auto;
      background: var(--bg-canvas);
      border: 1px solid var(--border-subtle);
      border-radius: 8px;
      padding: 8px;
    }

    .preview-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 10px;
      background: var(--bg-input);
      border-radius: 4px;
      font-size: 0.8rem;
      font-family: monospace;
    }

    .banner {
      padding: 12px 14px;
      border-radius: 8px;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .banner-info {
      background: var(--accent-soft);
      color: #93c5fd;
      border: 1px solid rgba(37, 99, 235, 0.3);
    }

    .banner-error {
      background: var(--error-bg);
      color: var(--error-text);
      border: 1px solid rgba(239, 68, 68, 0.3);
    }
  </style>
</head>
<body>

  <header>
    <div class="app-title">
      <span>MIDI &rarr; .riffle</span>
      <span class="pill">iPad Native</span>
    </div>
    <button type="button" class="btn btn-secondary" id="btnReset">Reset</button>
  </header>

  <main>
    <!-- Step 1: File Input & Configuration -->
    <section class="card">
      <div class="card-title">
        <span>1. Input MIDI File</span>
      </div>

      <div class="file-dropzone" id="dropzone">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: var(--text-muted);">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
          <polyline points="14 2 14 8 20 8"></polyline>
          <line x1="12" y1="18" x2="12" y2="12"></line>
          <line x1="9" y1="15" x2="15" y2="15"></line>
        </svg>
        <span id="filePrompt">Tap to browse Files (.mid, .midi)</span>
        <input type="file" id="midiInput" accept=".mid,.midi,audio/midi,audio/x-midi">
      </div>

      <div class="form-group">
        <label for="trackSelect">Track Selection</label>
        <select id="trackSelect" disabled>
          <option value="auto">Select MIDI file first</option>
        </select>
      </div>

      <div class="form-group">
        <label for="gridSubdiv">Sustain Grid (Subdivision Ticks)</label>
        <select id="gridSubdiv">
          <option value="500" selected>8th Note Grid (500 ticks - RifflerFLOW standard)</option>
          <option value="250">16th Note Grid (250 ticks)</option>
          <option value="1000">Quarter Note Grid (1000 ticks)</option>
          <option value="0">Disabled (Raw note durations)</option>
        </select>
      </div>

      <div class="stat-row">
        <div class="stat-box">
          <div class="stat-label">BPM (Header [1])</div>
          <div class="stat-value" id="dispBpm">--</div>
        </div>
        <div class="stat-box">
          <div class="stat-label">Notes Found</div>
          <div class="stat-value" id="dispNotes">0</div>
        </div>
      </div>
    </section>

    <!-- Step 2: Inspection & Compilation -->
    <section class="card">
      <div class="card-title">
        <span>2. Pattern Structure & Export</span>
      </div>

      <div id="statusBox">
        <div class="banner banner-info">
          Awaiting standard MIDI file. Output is structured as a 2,944-token UTF-16LE file.
        </div>
      </div>

      <div class="form-group">
        <label>Slot Preview (Pitch, Duration, Gate)</label>
        <div class="preview-box" id="previewContainer">
          <div class="preview-row" style="color: var(--text-muted); justify-content: center;">No sequence compiled</div>
        </div>
      </div>

      <button type="button" class="btn btn-primary" id="btnExport" disabled style="margin-top: auto;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
          <polyline points="7 10 12 15 17 10"></polyline>
          <line x1="12" y1="15" x2="12" y2="3"></line>
        </svg>
        <span>Export .riffle File</span>
      </button>
    </section>
  </main>

  <script>
    (function () {
      'use strict';

      // Application State
      let parsedSMF = null;
      let compiledSlots = null;
      let activeBpm = 120;
      let exportFileName = "pattern";

      // DOM Elements
      const midiInput = document.getElementById('midiInput');
      const filePrompt = document.getElementById('filePrompt');
      const dropzone = document.getElementById('dropzone');
      const trackSelect = document.getElementById('trackSelect');
      const gridSubdiv = document.getElementById('gridSubdiv');
      const dispBpm = document.getElementById('dispBpm');
      const dispNotes = document.getElementById('dispNotes');
      const previewContainer = document.getElementById('previewContainer');
      const btnExport = document.getElementById('btnExport');
      const btnReset = document.getElementById('btnReset');
      const statusBox = document.getElementById('statusBox');

      // Reset file input value on pointerdown to guarantee change event triggers on re-upload
      midiInput.addEventListener('pointerdown', () => {
        midiInput.value = '';
      });

      midiInput.addEventListener('change', handleFileSelected);

      // Drag and drop feedback
      ['dragenter', 'dragover'].forEach(evt => {
        dropzone.addEventListener(evt, (e) => {
          e.preventDefault();
          dropzone.classList.add('active');
        });
      });
      ['dragleave', 'drop'].forEach(evt => {
        dropzone.addEventListener(evt, (e) => {
          e.preventDefault();
          dropzone.classList.remove('active');
        });
      });
      dropzone.addEventListener('drop', (e) => {
        if (e.dataTransfer && e.dataTransfer.files.length > 0) {
          midiInput.files = e.dataTransfer.files;
          handleFileSelected();
        }
      });

      trackSelect.addEventListener('change', compilePattern);
      gridSubdiv.addEventListener('change', compilePattern);
      btnReset.addEventListener('click', resetApplication);
      btnExport.addEventListener('click', exportRiffleFile);

      function setStatus(message, isError = false) {
        statusBox.innerHTML = `
          <div class="banner ${isError ? 'banner-error' : 'banner-info'}">
            ${message}
          </div>
        `;
      }

      function resetApplication() {
        midiInput.value = '';
        parsedSMF = null;
        compiledSlots = null;
        activeBpm = 120;
        exportFileName = "pattern";
        filePrompt.textContent = "Tap to browse Files (.mid, .midi)";
        trackSelect.innerHTML = '<option value="auto">Select MIDI file first</option>';
        trackSelect.disabled = true;
        dispBpm.textContent = "--";
        dispNotes.textContent = "0";
        previewContainer.innerHTML = '<div class="preview-row" style="color: var(--text-muted); justify-content: center;">No sequence compiled</div>';
        btnExport.disabled = true;
        setStatus("Awaiting standard MIDI file. Output is structured as a 2,944-token UTF-16LE file.");
      }

      async function handleFileSelected() {
        const file = midiInput.files[0];
        if (!file) return;

        exportFileName = file.name.replace(/\.[^/.]+$/, "");
        filePrompt.textContent = file.name;

        try {
          const buffer = await file.arrayBuffer();
          parsedSMF = decodeSMF(buffer);

          if (!parsedSMF || parsedSMF.tracks.length === 0) {
            throw new Error("No MIDI tracks found in file.");
          }

          // Populate track select dropdown
          trackSelect.innerHTML = '';
          let optimalTrack = 0;
          let maxNoteEvents = -1;

          parsedSMF.tracks.forEach((trk, idx) => {
            const opt = document.createElement('option');
            opt.value = idx;
            opt.textContent = `Track ${idx + 1} (${trk.notes.length} notes)`;
            trackSelect.appendChild(opt);

            if (trk.notes.length > maxNoteEvents) {
              maxNoteEvents = trk.notes.length;
              optimalTrack = idx;
            }
          });

          trackSelect.disabled = false;
          trackSelect.value = optimalTrack;

          activeBpm = parsedSMF.bpm || 120;
          dispBpm.textContent = Math.round(activeBpm);

          compilePattern();
        } catch (err) {
          setStatus(`Failed to read MIDI file: ${err.message}`, true);
          btnExport.disabled = true;
        }
      }

      // Zero-dependency SMF parser
      function decodeSMF(buffer) {
        const view = new DataView(buffer);
        let ptr = 0;

        function readASCII(length) {
          let str = "";
          for (let i = 0; i < length; i++) {
            str += String.fromCharCode(view.getUint8(ptr++));
          }
          return str;
        }

        const magic = readASCII(4);
        if (magic !== "MThd") throw new Error("Invalid MIDI header (expected 'MThd').");

        const headerLen = view.getUint32(ptr); ptr += 4;
        const format = view.getUint16(ptr); ptr += 2;
        const numTracks = view.getUint16(ptr); ptr += 2;
        const division = view.getUint16(ptr); ptr += 2;

        if (headerLen > 6) ptr += (headerLen - 6);

        let initialBpm = 120;
        const tracks = [];

        for (let t = 0; t < numTracks; t++) {
          if (ptr >= buffer.byteLength) break;
          const trkHead = readASCII(4);
          const trkLen = view.getUint32(ptr); ptr += 4;
          const trkEnd = ptr + trkLen;

          let tickAccumulator = 0;
          let runningStatus = 0;
          const activeNotes = {};
          const notes = [];

          while (ptr < trkEnd) {
            // Read variable-length quantity (delta time)
            let delta = 0;
            while (true) {
              const b = view.getUint8(ptr++);
              delta = (delta << 7) | (b & 0x7F);
              if (!(b & 0x80)) break;
            }
            tickAccumulator += delta;

            let status = view.getUint8(ptr);
            if (status & 0x80) {
              runningStatus = status;
              ptr++;
            } else {
              status = runningStatus;
            }

            const type = status & 0xF0;

            if (status === 0xFF) {
              // Meta Event
              const metaType = view.getUint8(ptr++);
              let metaLen = 0;
              while (true) {
                const b = view.getUint8(ptr++);
                metaLen = (metaLen << 7) | (b & 0x7F);
                if (!(b & 0x80)) break;
              }
              if (metaType === 0x51 && metaLen === 3) {
                // Set Tempo
                const usPerQuarter = (view.getUint8(ptr) << 16) | (view.getUint8(ptr + 1) << 8) | view.getUint8(ptr + 2);
                initialBpm = 60000000 / usPerQuarter;
              }
              ptr += metaLen;
            } else if (status === 0xF0 || status === 0xF7) {
              // SysEx
              let sysexLen = 0;
              while (true) {
                const b = view.getUint8(ptr++);
                sysexLen = (sysexLen << 7) | (b & 0x7F);
                if (!(b & 0x80)) break;
              }
              ptr += sysexLen;
            } else if (type === 0x90) {
              // Note On
              const key = view.getUint8(ptr++);
              const vel = view.getUint8(ptr++);
              if (vel > 0) {
                activeNotes[key] = { key, startTicks: tickAccumulator };
              } else if (activeNotes[key]) {
                const n = activeNotes[key];
                notes.push({
                  key: n.key,
                  startTicks: n.startTicks,
                  durationTicks: tickAccumulator - n.startTicks
                });
                delete activeNotes[key];
              }
            } else if (type === 0x80) {
              // Note Off
              const key = view.getUint8(ptr++);
              ptr++; // velocity
              if (activeNotes[key]) {
                const n = activeNotes[key];
                notes.push({
                  key: n.key,
                  startTicks: n.startTicks,
                  durationTicks: tickAccumulator - n.startTicks
                });
                delete activeNotes[key];
              }
            } else if (type === 0xC0 || type === 0xD0) {
              ptr += 1;
            } else {
              ptr += 2;
            }
          }

          notes.sort((a, b) => a.startTicks - b.startTicks);
          tracks.push({ notes });
        }

        return {
          bpm: initialBpm,
          ticksPerBeat: (division & 0x8000) ? 480 : division,
          tracks
        };
      }

      function compilePattern() {
        const trackIdx = parseInt(trackSelect.value, 10);
        const track = parsedSMF.tracks[trackIdx];

        if (!track || track.notes.length === 0) {
          setStatus("The selected track has no note data.", true);
          dispNotes.textContent = "0";
          previewContainer.innerHTML = '<div class="preview-row" style="color: var(--text-muted); justify-content: center;">Track has 0 notes</div>';
          btnExport.disabled = true;
          return;
        }

        const tpq = parsedSMF.ticksPerBeat || 480;
        const tickRescale = 1000 / tpq; // Scale so quarter note = 1000 ticks
        const gridStep = parseInt(gridSubdiv.value, 10);

        const slots = [];
        let noteCount = 0;

        // 128 note slots max safety ceiling
        for (let i = 0; i < track.notes.length && slots.length < 128; i++) {
          const raw = track.notes[i];
          const rifflePitch = raw.key - 12; // Ground Truth: MIDI Note - 12
          const scaledDuration = Math.round(raw.durationTicks * tickRescale);

          if (gridStep > 0 && scaledDuration > gridStep) {
            // Sustained note spanning grid units:
            // Attack subdivision gets gate ~124; consecutive tied subdivisions get gate = 0
            let rem = scaledDuration;
            let isAttack = true;
            while (rem > 0 && slots.length < 128) {
              const dur = Math.min(rem, gridStep);
              slots.push({
                pitch: rifflePitch,
                duration: dur,
                gate: isAttack ? 124 : 0
              });
              rem -= dur;
              isAttack = false;
            }
          } else {
            slots.push({
              pitch: rifflePitch,
              duration: scaledDuration,
              gate: 124
            });
          }
          noteCount++;
        }

        compiledSlots = slots;
        dispNotes.textContent = noteCount;

        // Render preview rows
        previewContainer.innerHTML = '';
        slots.slice(0, 32).forEach((s, idx) => {
          const row = document.createElement('div');
          row.className = 'preview-row';
          row.innerHTML = `
            <span>#${idx + 1}: Pitch ${s.pitch} (MIDI ${s.pitch + 12})</span>
            <span>Dur: ${s.duration} | Gate: ${s.gate}</span>
          `;
          previewContainer.appendChild(row);
        });

        if (slots.length > 32) {
          const more = document.createElement('div');
          more.className = 'preview-row';
          more.style.color = 'var(--text-muted)';
          more.style.justifyContent = 'center';
          more.textContent = `+ ${slots.length - 32} additional slots`;
          previewContainer.appendChild(more);
        }

        btnExport.disabled = false;
        setStatus(`Compiled ${slots.length} note-slots with sustain gate handling. Ready to export.`);
      }

      function exportRiffleFile() {
        if (!compiledSlots || compiledSlots.length === 0) return;

        // Initialize full 2,944 integer array
        const tokens = new Int32Array(2944);

        // 1. Base Header (0..1023)
        // Adopting verified field patterns proven in ground-truth sample files
        tokens[0] = 200;
        tokens[1] = Math.round(activeBpm * 100);
        tokens[2] = 8;
        tokens[4] = 69;
        tokens[5] = 7;
        tokens[11] = 2;
        tokens[12] = 1;
        tokens[15] = 5;
        tokens[17] = 1;
        tokens[18] = 1;
        tokens[19] = 7;
        tokens[29] = 1;
        // 8-bar loop allocations (4000 ticks per bar)
        for (let b = 31; b <= 38; b++) {
          tokens[b] = 4000;
        }
        tokens[42] = 81;
        tokens[43] = 78;
        tokens[45] = 69;
        tokens[46] = 5;
        tokens[48] = 8;

        // 2. Pitch Array (1024..1535)
        // 3. Duration Array (1536..2047)
        // 4. Gate Array (2048..2559)
        const activeCount = compiledSlots.length;
        for (let i = 0; i < activeCount; i++) {
          tokens[1024 + i] = compiledSlots[i].pitch;
          tokens[1536 + i] = compiledSlots[i].duration;
          tokens[2048 + i] = compiledSlots[i].gate;
        }

        // Pad to multiple of 8, then set sentinel -1
        const paddedCount = Math.ceil(activeCount / 8) * 8;
        for (let i = activeCount; i < paddedCount; i++) {
          tokens[1024 + i] = 0;
          tokens[1536 + i] = 0;
          tokens[2048 + i] = 0;
        }

        if (paddedCount < 512) {
          tokens[1024 + paddedCount] = -1;
          tokens[1536 + paddedCount] = -1;
          tokens[2048 + paddedCount] = -1;
        }

        // 5. Chord Attribute Block (2560..2943)
        for (let i = 2560; i < 2944; i++) {
          tokens[i] = 69; // 'E' baseline padding
        }
        tokens[2627] = 88; // End of section marker observed in ground-truth files

        // Format to UTF-16LE text with BOM
        const commaString = tokens.join(",") + ",";
        const charLen = commaString.length;
        const outBuffer = new ArrayBuffer(2 + charLen * 2);
        const outView = new DataView(outBuffer);

        // UTF-16LE Byte Order Mark (0xFEFF)
        outView.setUint16(0, 0xFEFF, true);

        let byteIndex = 2;
        for (let i = 0; i < charLen; i++) {
          outView.setUint16(byteIndex, commaString.charCodeAt(i), true);
          byteIndex += 2;
        }

        // Trigger native download
        const blob = new Blob([outBuffer], { type: "application/octet-stream" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = `${exportFileName}.riffle`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);

        setStatus(`Exported "${a.download}" successfully. You can now import it directly into Riffler.`);
      }
    })();
  </script>
</body>
</html>
