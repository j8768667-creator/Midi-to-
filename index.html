<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>MIDI to Riffer (.riffle) Converter</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    :root {
      --bg: #0f1115;
      --panel: #16181e;
      --panel-border: #262933;
      --text: #e2e8f0;
      --text-muted: #848d9f;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --active-cell: #10b981;
      --active-dur: #f59e0b;
      --active-vel: #ec4899;
      --cell-empty: #1a1d24;
    }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      touch-action: manipulation;
    }

    body {
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      padding: env(safe-area-inset-top, 16px) env(safe-area-inset-right, 16px) env(safe-area-inset-bottom, 16px) env(safe-area-inset-left, 16px);
    }

    header {
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--panel-border);
      gap: 12px;
      flex-wrap: wrap;
    }

    .title-area h1 {
      margin: 0;
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: 0.02em;
    }

    .title-area p {
      margin: 2px 0 0 0;
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .header-actions {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    /* 44x44px Minimum Touch Target Standard */
    .btn, .file-trigger {
      min-height: 44px;
      min-width: 44px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0 18px;
      border-radius: 6px;
      font-size: 0.9rem;
      font-weight: 600;
      border: 1px solid var(--panel-border);
      background-color: var(--panel);
      color: var(--text);
      cursor: pointer;
      touch-action: manipulation;
    }

    .btn-primary {
      background-color: var(--accent);
      border-color: var(--accent);
      color: #ffffff;
    }

    .btn:active, .file-trigger:active {
      opacity: 0.8;
    }

    .btn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
      pointer-events: none;
    }

    input[type="file"] {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      border: 0;
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 16px;
      padding: 16px 0;
    }

    .meta-bar {
      background: var(--panel);
      border: 1px solid var(--panel-border);
      border-radius: 8px;
      padding: 12px 16px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 12px;
      align-items: center;
    }

    .meta-item {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .meta-item span:first-child {
      font-size: 0.75rem;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    .meta-item span:last-child {
      font-size: 1.1rem;
      font-weight: 700;
    }

    .control-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .control-group label {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    select, input[type="number"] {
      min-height: 44px;
      padding: 0 12px;
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--panel-border);
      border-radius: 6px;
      font-size: 0.95rem;
      touch-action: manipulation;
    }

    .lanes-scroll-wrap {
      background: var(--panel);
      border: 1px solid var(--panel-border);
      border-radius: 8px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }

    .lane-block {
      display: flex;
      flex-direction: column;
      gap: 6px;
      width: max-content;
    }

    .lane-heading {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }

    .lane-row {
      display: grid;
      grid-auto-flow: column;
      grid-auto-columns: minmax(44px, 1fr);
      gap: 4px;
    }

    .step-cell {
      min-width: 44px;
      height: 48px;
      background: var(--cell-empty);
      border: 1px solid var(--panel-border);
      border-radius: 4px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 0.75rem;
      font-weight: 600;
    }

    .step-cell span:first-child {
      font-size: 0.65rem;
      color: var(--text-muted);
    }

    .step-cell.active-pitch {
      border-color: var(--active-cell);
      color: var(--active-cell);
      background: rgba(16, 185, 129, 0.15);
    }

    .step-cell.active-dur {
      border-color: var(--active-dur);
      color: var(--active-dur);
      background: rgba(245, 158, 11, 0.15);
    }

    .step-cell.active-vel {
      border-color: var(--active-vel);
      color: var(--active-vel);
      background: rgba(236, 72, 153, 0.15);
    }

    footer {
      padding-top: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.8rem;
      color: var(--text-muted);
      border-top: 1px solid var(--panel-border);
    }

    #status {
      font-weight: 500;
      color: var(--accent);
    }
  </style>
</head>
<body>

  <header>
    <div class="title-area">
      <h1>Audiomodern Riffer Transposer</h1>
      <p>MIDI to 3,456-Token Fixed Structure .riffle Format</p>
    </div>
    <div class="header-actions">
      <label class="file-trigger" for="midiFile">
        <span>Open MIDI</span>
        <input type="file" id="midiFile" accept=".mid,.midi,audio/midi,audio/x-midi">
      </label>
      <button type="button" class="btn" id="previewBtn" disabled>Preview</button>
      <button type="button" class="btn btn-primary" id="exportBtn" disabled>Export .riffle</button>
    </div>
  </header>

  <main>
    <section class="meta-bar">
      <div class="meta-item">
        <span>Tempo</span>
        <span id="tempoText">120.0 BPM</span>
      </div>
      <div class="meta-item">
        <span>Length</span>
        <span id="stepsText">16 Steps</span>
      </div>
      <div class="meta-item">
        <span>Root Pitch</span>
        <span id="rootText">C (60)</span>
      </div>
      <div class="control-group">
        <label for="quantizeSelect">Grid:</label>
        <select id="quantizeSelect">
          <option value="16" selected>1/16</option>
          <option value="8">1/8</option>
          <option value="32">1/32</option>
        </select>
      </div>
      <div class="control-group">
        <label for="transpose">Transpose:</label>
        <input type="number" id="transpose" value="0" min="-24" max="24" style="width: 75px;">
      </div>
    </section>

    <section class="lanes-scroll-wrap">
      <div class="lane-block">
        <div class="lane-heading">Pitch Lane (Steps 1–64)</div>
        <div class="lane-row" id="pitchRow"></div>
      </div>
      <div class="lane-block">
        <div class="lane-heading">Duration Lane (Milliseconds)</div>
        <div class="lane-row" id="durRow"></div>
      </div>
      <div class="lane-block">
        <div class="lane-heading">Velocity Lane (0–127)</div>
        <div class="lane-row" id="velRow"></div>
      </div>
    </section>
  </main>

  <footer>
    <span id="status">Select a standard MIDI file to begin.</span>
    <span>Preset Standard: Fixed 3,456 Integers</span>
  </footer>

  <script>
    const NOTE_NAMES = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];
    
    // Exact schema based on native Riffer presets:
    // Fixed total length: 3,456 integers
    // Pitches start at index 700
    // Durations start at index 1000
    // Velocities start at index 1300
    const RIFFLE_ARRAY_LEN = 3456;
    const PITCH_START = 700;
    const DUR_START = 1000;
    const VEL_START = 1300;

    const state = {
      bpm: 120.0,
      steps: 16,
      rootNote: 60,
      pitches: new Array(64).fill(0),
      durations: new Array(64).fill(0),
      velocities: new Array(64).fill(0),
      gridDivision: 4 // 16th note default
    };

    let audioCtx = null;
    function getAudioCtx() {
      if (!audioCtx) {
        const AudioClass = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AudioClass();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      return audioCtx;
    }

    // Standard Binary MIDI Parser (Format 0/1)
    function parseMidiFile(buffer) {
      const dv = new DataView(buffer);
      let p = 0;

      function readAscii(len) {
        let s = "";
        for (let i = 0; i < len; i++) s += String.fromCharCode(dv.getUint8(p++));
        return s;
      }

      if (readAscii(4) !== "MThd") throw new Error("File is not a valid standard MIDI file.");
      const headerLen = dv.getUint32(p); p += 4;
      const format = dv.getUint16(p); p += 2;
      const numTracks = dv.getUint16(p); p += 2;
      const division = dv.getUint16(p); p += 2;
      p += (headerLen - 6);

      const ticksPerQuarter = (division & 0x8000) === 0 ? division : 480;
      let microsecondsPerQuarter = 500000; // 120 BPM
      const rawEvents = [];

      for (let t = 0; t < numTracks; t++) {
        if (p >= dv.byteLength) break;
        const trackId = readAscii(4);
        const trackLen = dv.getUint32(p); p += 4;
        if (trackId !== "MTrk") {
          p += trackLen;
          continue;
        }

        let trackPos = p;
        const trackEnd = trackPos + trackLen;
        let runningStatus = 0;
        let trackTick = 0;

        while (trackPos < trackEnd) {
          let delta = 0;
          while (true) {
            const b = dv.getUint8(trackPos++);
            delta = (delta << 7) | (b & 0x7F);
            if (!(b & 0x80)) break;
          }
          trackTick += delta;

          let status = dv.getUint8(trackPos);
          if (status >= 0x80) {
            trackPos++;
            runningStatus = status;
          } else {
            status = runningStatus;
          }

          const type = status >> 4;

          if (status === 0xFF) {
            const metaType = dv.getUint8(trackPos++);
            let metaLen = 0;
            while (true) {
              const b = dv.getUint8(trackPos++);
              metaLen = (metaLen << 7) | (b & 0x7F);
              if (!(b & 0x80)) break;
            }
            if (metaType === 0x51 && metaLen === 3) {
              microsecondsPerQuarter = (dv.getUint8(trackPos) << 16) | (dv.getUint8(trackPos + 1) << 8) | dv.getUint8(trackPos + 2);
            }
            trackPos += metaLen;
          } else if (status === 0xF0 || status === 0xF7) {
            let sysLen = 0;
            while (true) {
              const b = dv.getUint8(trackPos++);
              sysLen = (sysLen << 7) | (b & 0x7F);
              if (!(b & 0x80)) break;
            }
            trackPos += sysLen;
          } else if (type === 0x9) {
            const note = dv.getUint8(trackPos++);
            const vel = dv.getUint8(trackPos++);
            rawEvents.push({ tick: trackTick, type: vel > 0 ? 'on' : 'off', note, vel });
          } else if (type === 0x8) {
            const note = dv.getUint8(trackPos++);
            dv.getUint8(trackPos++);
            rawEvents.push({ tick: trackTick, type: 'off', note, vel: 0 });
          } else if (type === 0xA || type === 0xB || type === 0xE) {
            trackPos += 2;
          } else if (type === 0xC || type === 0xD) {
            trackPos += 1;
          }
        }
        p = trackEnd;
      }

      return { ticksPerQuarter, tempo: microsecondsPerQuarter, events: rawEvents };
    }

    function processMidi(parsed) {
      state.bpm = Math.round((60000000 / parsed.tempo) * 10) / 10;
      const ticksPerStep = parsed.ticksPerQuarter / state.gridDivision;
      const onMap = new Map();
      const notes = [];

      parsed.events.sort((a, b) => a.tick - b.tick);

      parsed.events.forEach(e => {
        if (e.type === 'on') {
          onMap.set(e.note, { tick: e.tick, vel: e.vel });
        } else if (e.type === 'off' && onMap.has(e.note)) {
          const start = onMap.get(e.note);
          const durTicks = Math.max(1, e.tick - start.tick);
          const stepIndex = Math.round(start.tick / ticksPerStep);
          const durMs = Math.round((durTicks / parsed.ticksPerQuarter) * (60000 / state.bpm));
          notes.push({ step: stepIndex, pitch: e.note, vel: start.vel, dur: durMs });
          onMap.delete(e.note);
        }
      });

      if (notes.length === 0) throw new Error("No MIDI note messages found.");

      const maxStep = Math.max(...notes.map(n => n.step));
      let stepCapacity = 16;
      if (maxStep >= 32) stepCapacity = 64;
      else if (maxStep >= 16) stepCapacity = 32;

      state.steps = stepCapacity;
      state.pitches.fill(0);
      state.durations.fill(0);
      state.velocities.fill(0);

      const transposeOffset = parseInt(document.getElementById('transpose').value, 10) || 0;

      notes.forEach(n => {
        if (n.step < stepCapacity) {
          state.pitches[n.step] = Math.max(0, Math.min(127, n.pitch + transposeOffset));
          state.durations[n.step] = n.dur;
          state.velocities[n.step] = n.vel;
        }
      });

      const stepDurationMs = Math.round(60000 / (state.bpm * state.gridDivision));
      for (let i = 0; i < stepCapacity; i++) {
        if (state.pitches[i] > 0 && state.durations[i] === 0) {
          state.durations[i] = stepDurationMs;
        }
      }

      const activePitch = state.pitches.find(p => p > 0);
      state.rootNote = activePitch || 60;

      render();
    }

    function render() {
      document.getElementById('tempoText').textContent = `${state.bpm.toFixed(1)} BPM`;
      document.getElementById('stepsText').textContent = `${state.steps} Steps`;
      document.getElementById('rootText').textContent = `${NOTE_NAMES[state.rootNote % 12]} (${state.rootNote})`;

      const pRow = document.getElementById('pitchRow');
      const dRow = document.getElementById('durRow');
      const vRow = document.getElementById('velRow');

      pRow.innerHTML = '';
      dRow.innerHTML = '';
      vRow.innerHTML = '';

      let activeCount = 0;

      for (let i = 0; i < state.steps; i++) {
        const p = state.pitches[i];
        const d = state.durations[i];
        const v = state.velocities[i];

        if (p > 0) activeCount++;

        const pCell = document.createElement('div');
        pCell.className = `step-cell ${p > 0 ? 'active-pitch' : ''}`;
        pCell.innerHTML = `<span>${i + 1}</span><span>${p > 0 ? NOTE_NAMES[p % 12] + Math.floor(p / 12 - 1) : '-'}</span>`;
        pRow.appendChild(pCell);

        const dCell = document.createElement('div');
        dCell.className = `step-cell ${d > 0 ? 'active-dur' : ''}`;
        dCell.innerHTML = `<span>${i + 1}</span><span>${d > 0 ? d : '-'}</span>`;
        dRow.appendChild(dCell);

        const vCell = document.createElement('div');
        vCell.className = `step-cell ${v > 0 ? 'active-vel' : ''}`;
        vCell.innerHTML = `<span>${i + 1}</span><span>${v > 0 ? v : '-'}</span>`;
        vRow.appendChild(vCell);
      }

      document.getElementById('previewBtn').disabled = activeCount === 0;
      document.getElementById('exportBtn').disabled = activeCount === 0;
    }

    // Fixed 3456-Length Riffer Generator Function
    function buildRiffleBuffer() {
      const arr = new Array(RIFFLE_ARRAY_LEN).fill(0);

      // Header Indices
      arr[0] = 200; // Riffer version token
      arr[1] = Math.round(state.bpm * 100); // BPM * 100
      arr[2] = state.steps; // Number of steps
      arr[3] = 0;
      arr[4] = state.rootNote; // Scale / Root reference
      arr[7] = 1;
      arr[11] = 3;
      arr[13] = 1;
      arr[16] = 2;
      arr[19] = 9;
      arr[29] = 1;

      // Loop Step Markers (Indices 31..38 set to 4000)
      for (let i = 31; i <= 38; i++) {
        arr[i] = 4000;
      }

      arr[47] = 65;
      arr[49] = 8;

      // Populate Step Lanes
      for (let i = 0; i < state.steps; i++) {
        arr[PITCH_START + i] = state.pitches[i];
        arr[DUR_START + i] = state.durations[i];
        arr[VEL_START + i] = state.velocities[i];
      }

      // Exact Delimiter Tokens Required by Riffer
      arr[799] = -1;
      arr[1099] = -1;
      arr[1399] = -1;

      // Format as comma-separated string with strictly no trailing comma
      return arr.join(',');
    }

    // Touch Event Wire-ups
    const fileInput = document.getElementById('midiFile');
    const statusText = document.getElementById('status');

    fileInput.addEventListener('change', function(e) {
      const f = e.target.files[0];
      if (!f) return;

      statusText.textContent = `Processing ${f.name}...`;
      const reader = new FileReader();

      reader.onload = function(evt) {
        try {
          const parsed = parseMidiFile(evt.target.result);
          processMidi(parsed);
          statusText.textContent = `Loaded ${f.name} successfully.`;
        } catch (err) {
          statusText.textContent = `Error: ${err.message}`;
        }
      };

      reader.onerror = () => { statusText.textContent = "Failed reading file."; };
      reader.readAsArrayBuffer(f);
      this.value = ''; // Reset input to allow reloading same file
    });

    document.getElementById('quantizeSelect').addEventListener('change', (e) => {
      state.gridDivision = parseInt(e.target.value, 10) / 4;
    });

    document.getElementById('transpose').addEventListener('input', () => {
      if (state.pitches.some(p => p > 0)) render();
    });

    // Touch-safe Web Audio synthesizer preview
    document.getElementById('previewBtn').addEventListener('pointerdown', () => {
      const ctx = getAudioCtx();
      const start = ctx.currentTime + 0.05;
      const stepDuration = (60 / state.bpm) / state.gridDivision;

      for (let i = 0; i < state.steps; i++) {
        const p = state.pitches[i];
        const v = state.velocities[i];
        if (p > 0 && v > 0) {
          const noteTime = start + (i * stepDuration);
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();

          const freq = 440 * Math.pow(2, (p - 69) / 12);
          osc.frequency.setValueAtTime(freq, noteTime);

          const gainVal = (v / 127) * 0.25;
          const durSec = Math.max(0.04, (state.durations[i] || (stepDuration * 1000)) / 1000);

          gain.gain.setValueAtTime(gainVal, noteTime);
          gain.gain.exponentialRampToValueAtTime(0.0001, noteTime + durSec);

          osc.connect(gain);
          gain.connect(ctx.destination);

          osc.start(noteTime);
          osc.stop(noteTime + durSec);
        }
      }
      statusText.textContent = "Playing preview...";
    });

    // Standard Blob Export
    document.getElementById('exportBtn').addEventListener('pointerdown', () => {
      try {
        const textData = buildRiffleBuffer();
        const blob = new Blob([textData], { type: 'text/plain;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `transposed_riff_${Date.now()}.riffle`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        statusText.textContent = "Exported 3,456-token .riffle file successfully.";
      } catch (err) {
        statusText.textContent = `Export failed: ${err.message}`;
      }
    });
  </script>
</body>
</html>
